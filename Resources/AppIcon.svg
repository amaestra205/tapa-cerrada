<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f9e"/>
      <stop offset="0.55" stop-color="#1c1f5a"/>
      <stop offset="1" stop-color="#0b0c26"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#7fe3ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7fe3ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ff0ff"/>
      <stop offset="0.5" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#9a5cff"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2d40"/>
      <stop offset="1" stop-color="#14151f"/>
    </linearGradient>
    <linearGradient id="alu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6fb"/>
      <stop offset="0.6" stop-color="#c9ced9"/>
      <stop offset="1" stop-color="#8e94a3"/>
    </linearGradient>
    <linearGradient id="stand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfd4de"/>
      <stop offset="1" stop-color="#7d8392"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <!-- squircle base -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#sq)">
    <circle cx="512" cy="400" r="420" fill="url(#glow)"/>
    <!-- stars -->
    <g fill="#ffffff" opacity="0.7">
      <circle cx="210" cy="215" r="5"/><circle cx="805" cy="190" r="4"/>
      <circle cx="850" cy="330" r="3"/><circle cx="170" cy="380" r="3"/>
      <circle cx="300" cy="160" r="3"/>
    </g>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4"/>
  </g>

  <!-- monitor stand -->
  <path d="M470 600 L554 600 L572 690 L452 690 Z" fill="url(#stand)"/>
  <rect x="390" y="684" width="244" height="22" rx="11" fill="url(#stand)"/>

  <!-- monitor -->
  <g filter="url(#shadow)">
    <rect x="236" y="250" width="552" height="364" rx="34" fill="url(#bezel)"/>
  </g>
  <rect x="258" y="272" width="508" height="320" rx="18" fill="url(#screen)"/>
  <rect x="258" y="272" width="508" height="140" rx="18" fill="#ffffff" opacity="0.10"/>

  <!-- cup on screen -->
  <g transform="translate(512 440)">
    <g fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.9">
      <path d="M-34 -118 c-18 18 18 30 0 52"/>
      <path d="M8 -128 c-18 18 18 30 0 52"/>
    </g>
    <path d="M-92 -50 H70 V20 a72 72 0 0 1 -72 72 H-20 a72 72 0 0 1 -72 -72 Z" fill="#ffffff"/>
    <path d="M70 -34 h18 a40 40 0 0 1 0 80 h-24" fill="none" stroke="#ffffff" stroke-width="20"/>
    <rect x="-122" y="100" width="222" height="16" rx="8" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- closed laptop -->
  <g filter="url(#shadow)">
    <path d="M222 772 H802 a14 14 0 0 1 14 14 v6 a30 30 0 0 1 -30 30 H238 a30 30 0 0 1 -30 -30 v-6 a14 14 0 0 1 14 -14 Z" fill="url(#alu)"/>
  </g>
  <rect x="222" y="760" width="580" height="22" rx="10" fill="#e9edf5"/>
  <rect x="452" y="800" width="120" height="8" rx="4" fill="#6c7282" opacity="0.6"/>

  <!-- cable -->
  <path d="M790 790 C 880 780, 870 650, 760 640" fill="none" stroke="#9aa3b5" stroke-width="10" stroke-linecap="round"/>
</svg>
